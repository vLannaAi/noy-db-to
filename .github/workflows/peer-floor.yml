name: Peer floor

# Does every store actually COMPILE against the oldest @noy-db/hub its peer
# range admits?
#
# Deliberately NOT part of ci.yml. Every gate there — build, lint, typecheck,
# 1717 tests — runs against the DEV PIN, so all of them stay green no matter how
# wrong the declared peer range is. This job is the only one that installs a
# different hub, which is why it needs the network and its own workflow.
#
# It exists because the gap shipped twice:
#   #89  16 packages advertised ^0.3.0 || ^0.4.0 || ^0.5.0 while importing
#        symbols that exist only from 0.6.0-pre. The same defect was live on the
#        0.5.0 stable line and had to be repaired by deprecating 17 versions.
#   #84  to-drive / to-icloud needed StoreLocator.register() to be generic,
#        which landed in 0.6.0-pre.11. Symbol presence does NOT catch that —
#        StoreFactory exists at pre.0, it just cannot accept the argument.
#        Only compiling against the floor finds it.
#
# Triggers are scoped to when a range or a dependency can actually change:
# any package.json edit, plus manual dispatch. Running it on every push would
# cost two installs for changes that cannot affect the answer.

on:
  pull_request:
    paths: ['**/package.json', 'scripts/check-peer-floor.mjs', '.github/workflows/peer-floor.yml']
  push:
    branches: [main]
    paths: ['**/package.json', 'scripts/check-peer-floor.mjs', '.github/workflows/peer-floor.yml']
  workflow_dispatch:

concurrency:
  group: peer-floor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  peer-floor:
    name: Compile against the advertised floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Enable corepack (pnpm)
        run: corepack enable

      # No pnpm store cache here on purpose: this job's whole job is to resolve
      # hub versions that are NOT the dev pin, and a warm cache keyed on the
      # lockfile would mask a floor that cannot even be installed.
      - name: Install (dev pin)
        run: pnpm install --frozen-lockfile

      - name: Show the plan
        run: node scripts/check-peer-floor.mjs --dry-run

      - name: Compile every store against its declared floor
        run: node scripts/check-peer-floor.mjs
